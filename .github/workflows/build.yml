name: Build Android LeviLauncher mod

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.31.6"
          sudo apt-get update
          sudo apt-get install -y ninja-build zip
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure ARM64 native mod
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile native module
        run: cmake --build build --parallel 2

      - name: Package .levipack
        run: |
          mkdir -p dist/ProjectileIndicator
          cp manifest.json dist/ProjectileIndicator/manifest.json
          cp build/out/libprojectile_indicator.so dist/ProjectileIndicator/libprojectile_indicator.so
          cd dist/ProjectileIndicator
          zip -r ../ProjectileIndicator.levipack .
          cd ../..
          cp README.md dist/README.txt

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: ProjectileIndicator-levipack
          path: dist/ProjectileIndicator.levipack
          if-no-files-found: error
