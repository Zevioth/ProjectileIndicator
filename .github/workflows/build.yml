name: Build Android LeviLauncher Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.2.12479018"

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build mod
        run: ./build.sh

      - name: List build output
        run: |
          echo "=== Build output ==="
          find . -type f \( -name "*.so" -o -name "*.levipack" \) -print

      - name: Package LeviPack
        run: |
          mkdir -p dist
          zip -r dist/ProjectileIndicator.levipack \
            manifest.json \
            lib \
            assets 2>/dev/null || true

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: ProjectileIndicator-levipack
          path: dist/ProjectileIndicator.levipack
